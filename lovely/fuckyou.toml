[manifest]
version = "1.0.0"
dump_lua = true
priority = 1
#All faceses param check or smth im getting this from maxmius
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
if self.GAME.starting_params.no_faces and SMODS.Ranks[v.value].face then keep = false end
'''
position = "after"
payload = '''
if self.GAME.starting_params.jeej_all_faces and not SMODS.Ranks[v.value].face then keep = false end
'''
match_indent = true
times = 1